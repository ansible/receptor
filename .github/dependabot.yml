---
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "go"
    ignore:
      - dependency-name: "golang"
        versions: ["1.24", "1.25"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "github-actions"
  - package-ecosystem: "pip"
    directory: "/receptor-python-worker"
    groups:
      dependencies:
        patterns:
          - "*"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "pip"
  - package-ecosystem: "pip"
    directory: "/receptorctl"
    groups:
      dependencies:
        patterns:
          - "*"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "pip"
    ignore:
      # The click upper bound is deliberate (see #1553): 8.4 is a feature
      # release with CLI-facing changes and there is no advisory to chase.
      - dependency-name: "click"
        versions: [">=8.4.0"]
